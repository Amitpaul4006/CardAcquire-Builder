services:
  - type: web
    name: cardacquire-api
    runtime: node
    buildCommand: npm install && npm run prisma:generate --workspace=@cardacquire/api && npm run build --workspace=@cardacquire/api
    startCommand: npm run start --workspace=@cardacquire/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: UPLOAD_DIRECTORY
        value: /tmp/cardacquire-uploads

  - type: worker
    name: cardacquire-kyc-worker
    runtime: python
    buildCommand: pip install -r services/kyc-worker/requirements.txt
    startCommand: uvicorn app.main:app --app-dir services/kyc-worker --host 0.0.0.0 --port 8000
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-3-5-haiku-latest